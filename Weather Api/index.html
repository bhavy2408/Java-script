<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="weather-app">
      <!-- Header -->
      <header class="header">
        <div class="logo">
          <span>☁️</span>
          <h1>WeatherNow</h1>
        </div>

        <p>Live weather information</p>
      </header>

      <!-- Search -->
      <section class="search-section">
        <div class="search-box">
          <span class="search-icon">🔍</span>

          <input
            type="text"
            id="cityInput"
            placeholder="Search city..."
            autocomplete="off"
          />

          <button id="searchBtn">Search</button>
        </div>

        <p id="message"></p>
      </section>

      <!-- Main Weather -->
      <section class="weather-card">
        <div class="location">
          <span>📍</span>
          <div>
            <h2 id="cityName">Surat</h2>
            <p id="date">Today</p>
          </div>
        </div>

        <div class="main-weather">
          <div class="weather-icon-box">
            <img id="weatherIcon" src="" alt="Weather" />
          </div>

          <div class="temperature-section">
            <h3 id="temperature">--°</h3>

            <p id="description">Loading weather...</p>
          </div>
        </div>

        <!-- Weather Details -->
        <div class="weather-details">
          <div class="detail-card">
            <div class="detail-icon">💧</div>

            <div>
              <p>Humidity</p>
              <h4 id="humidity">--%</h4>
            </div>
          </div>

          <div class="detail-card">
            <div class="detail-icon">💨</div>

            <div>
              <p>Wind Speed</p>
              <h4 id="wind">-- m/s</h4>
            </div>
          </div>

          <div class="detail-card">
            <div class="detail-icon">🌡️</div>

            <div>
              <p>Feels Like</p>
              <h4 id="feelsLike">--°C</h4>
            </div>
          </div>

          <div class="detail-card">
            <div class="detail-icon">🔻</div>

            <div>
              <p>Minimum</p>
              <h4 id="minTemp">--°C</h4>
            </div>
          </div>

          <div class="detail-card">
            <div class="detail-icon">🔺</div>

            <div>
              <p>Maximum</p>
              <h4 id="maxTemp">--°C</h4>
            </div>
          </div>
        </div>
      </section>

      <!-- Footer -->
      <footer>
        <p>Weather data powered by OpenWeatherMap</p>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
