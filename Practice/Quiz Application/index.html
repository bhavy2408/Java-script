<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Application</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <!-- Start Page -->
  <div id="screenpage">
    <button id="Start_btn">Let's Start Quiz</button>
  </div>

  <!-- Question Page -->
  <div id="Qpage">
    <div id="Qtable">
      <div id="Question">
        <h2 id="Questiontext">

        </h2>
      </div>
      <div id="opt">
        <button class="option">Option 1</button>
        <button class="option">Option 2</button>
        <button class="option">Option 3</button>
        <button class="option">Option 4</button>
        <button id="next_btn">Next Question</button>
      </div>
    </div>
  </div>




  <script src="./script.js"></script>
</body>

</html>
