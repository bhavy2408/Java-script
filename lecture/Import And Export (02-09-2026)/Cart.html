<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Shope</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="min-h-screen flex flex-col">
    <main class="flex-1">
        <div id="header"></div>
        <div id="footer"  class="fixed bottom-0 left-0 w-full"></div>
    </main>
    <script>
        fetch('./components/Header.html').then(response => {
            return response.text()
        }).then(data => {
            document.getElementById('header').innerHTML = data
        })
        fetch('./components/Footer.html').then(response => {
            return response.text()
        }).then(data => {
            document.getElementById('footer').innerHTML = data
        })
    </script>
    <script type="module" src="./js/Helper.js"></script>
    <script type="module" src="./js/Home.js"></script>
</body>

</html>
