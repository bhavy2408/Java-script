<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
 <nav
  class="relative bg-gray-800 after:pointer-events-none after:absolute after:inset-x-0 after:bottom-0 after:h-px after:bg-white/10">

  <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">

    <div class="relative flex h-16 items-center justify-between">

      <!-- Mobile Menu Button -->
      <div class="absolute inset-y-0 left-0 flex items-center sm:hidden">
        <button
          type="button"
          class="relative inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-white/5 hover:text-white">

          <span class="sr-only">Open main menu</span>

          <!-- Menu Icon -->
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            class="size-6">

            <path
              d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
              stroke-linecap="round"
              stroke-linejoin="round" />

          </svg>
        </button>
      </div>

      

      <!-- Navigation -->
      <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">

        <div class="hidden sm:ml-6 sm:block">

          <div class="flex space-x-4">

            <!-- Home -->
            <a
              href="./index.html"
              class="rounded-md bg-gray-950 px-3 py-2 text-sm font-medium text-white hover:bg-gray-700">
              Home
            </a>

            <!-- Cart -->
            <a
              href="./Cart.html"
              class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white">
              Cart
            </a>

          </div>

        </div>

      </div>

      <!-- Notification -->
      <div class="absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0">

        <button
          type="button"
          class="relative rounded-full p-1 text-gray-400 hover:text-white">

          <span class="sr-only">View notifications</span>

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            class="size-6">

            <path
              d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"
              stroke-linecap="round"
              stroke-linejoin="round" />

          </svg>

        </button>

      </div>

    </div>

  </div>

</nav>
</body>

</html>
