
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Management</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- ================= HEADER ================= -->
    <header class="bg-gray-900 text-white shadow-lg">

        <div class="max-w-7xl mx-auto px-5 py-5">

            <h1 class="text-3xl font-bold">
                🛍️ Product Management
            </h1>

            <p class="text-gray-400 mt-1">
                Add, search, sort and manage your products
            </p>

        </div>

    </header>


    <!-- ================= MAIN ================= -->
    <main class="max-w-7xl mx-auto px-5 py-8">


        <!-- ================= ADD PRODUCT FORM ================= -->

        <section class="bg-white rounded-xl shadow-md p-6 mb-8">

            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                Add New Product
            </h2>

            <form id="productForm">

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">


                    <!-- Product Name -->
                    <div>

                        <label class="block font-medium text-gray-700 mb-2">
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="productName"
                            placeholder="Enter product name"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                        >

                    </div>


                    <!-- Product Price -->
                    <div>

                        <label class="block font-medium text-gray-700 mb-2">
                            Price
                        </label>

                        <input
                            type="number"
                            id="productPrice"
                            placeholder="Enter price"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                        >

                    </div>


                    <!-- Category -->
                    <div>

                        <label class="block font-medium text-gray-700 mb-2">
                            Category
                        </label>

                        <select
                            id="productCategory"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                        >

                            <option value="">
                                Select Category
                            </option>

                            <option value="Electronics">
                                Electronics
                            </option>

                            <option value="Clothing">
                                Clothing
                            </option>

                            <option value="Shoes">
                                Shoes
                            </option>

                            <option value="Accessories">
                                Accessories
                            </option>

                            <option value="Grocery">
                                Grocery
                            </option>

                        </select>

                    </div>


                    <!-- Image -->
                    <div>

                        <label class="block font-medium text-gray-700 mb-2">
                            Image URL
                        </label>

                        <input
                            type="text"
                            id="productImage"
                            placeholder="Enter image URL"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                        >

                    </div>

                </div>


                <!-- Error -->
                <p
                    id="formError"
                    class="text-red-500 mt-4 font-medium"
                ></p>


                <!-- Submit -->
                <button
                    type="submit"
                    class="mt-5 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition"
                >
                    ➕ Add Product
                </button>

            </form>

        </section>



        <!-- ================= SEARCH & SORT ================= -->

        <section class="bg-white rounded-xl shadow-md p-6 mb-8">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">


                <!-- Search -->
                <div>

                    <label class="block font-medium text-gray-700 mb-2">
                        🔍 Search Product
                    </label>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search product..."
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                    >

                </div>


                <!-- Category Filter -->
                <div>

                    <label class="block font-medium text-gray-700 mb-2">
                        📂 Filter Category
                    </label>

                    <select
                        id="categoryFilter"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                    >

                        <option value="All">
                            All Categories
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Clothing">
                            Clothing
                        </option>

                        <option value="Shoes">
                            Shoes
                        </option>

                        <option value="Accessories">
                            Accessories
                        </option>

                        <option value="Grocery">
                            Grocery
                        </option>

                    </select>

                </div>


                <!-- Sort -->
                <div>

                    <label class="block font-medium text-gray-700 mb-2">
                        ↕️ Sort By
                    </label>

                    <select
                        id="sortSelect"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                    >

                        <option value="default">
                            Default
                        </option>

                        <option value="low">
                            Price: Low to High
                        </option>

                        <option value="high">
                            Price: High to Low
                        </option>

                        <option value="az">
                            Name: A to Z
                        </option>

                        <option value="za">
                            Name: Z to A
                        </option>

                    </select>

                </div>

            </div>

        </section>



        <!-- ================= PRODUCT COUNT ================= -->

        <div class="flex justify-between items-center mb-5">

            <h2 class="text-2xl font-bold text-gray-800">
                Products
            </h2>

            <span
                id="productCount"
                class="bg-blue-100 text-blue-700 px-4 py-2 rounded-full font-semibold"
            >
                0 Products
            </span>

        </div>



        <!-- ================= PRODUCT LIST ================= -->

        <section
            id="productList"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
        >

        </section>


    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="bg-gray-900 text-gray-300 mt-12">

        <div class="max-w-7xl mx-auto px-5 py-8 text-center">

            <p>
                © 2026 Product Management System
            </p>

            <p class="text-gray-500 text-sm mt-2">
                Built with HTML, Tailwind CSS & JavaScript
            </p>

        </div>

    </footer>



    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
